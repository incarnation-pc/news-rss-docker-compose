name: news-rss-lab

services:

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8008:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://newsuser:${POSTGRES_PASSWORD}@db:5432/newsdb
      RSS_SERVICE_URL: http://web-service:8001
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: newsuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: newsdb
    volumes:
      - news_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsuser -d newsdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web-service:
    build: ./web-service
    restart: unless-stopped

volumes:
  news_data:
